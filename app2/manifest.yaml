apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: app2 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
       app: app2
    spec:
      containers:
      - name: app2
        image: mahe1120/app2:1.0.0
        ports:
        - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: app2
spec:
  selector:
    app: app2
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:631919637519:certificate/e0f16a97-e1a5-464d-b1b3-10e14c0dd064
    alb.ingress.kubernetes.io/group.name: mahe1120
spec:
  ingressClassName: alb
  rules:
  - host: "app2.mahedevops.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app2
            port:
              number: 80


  


